name: prosane_app
description: "App offline-first para el programa PROSANE (salud escolar, Salta)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  drift: ^2.35.1
  sqlite3: ^3.7.0
  path_provider: ^2.1.5
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.1.0
  freezed_annotation: ^3.1.0
  uuid: ^4.5.1
  file_picker: ^8.1.0
  share_plus: ^10.0.2
  open_filex: ^4.3.4
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: 4.0.2
  drift_dev: ^2.35.1
  mocktail: ^1.0.4
  widgetbook: ^3.11.0
  http_mock_adapter: ^0.6.1

flutter:
  uses-material-design: true

# SQLCipher en lugar de SQLite plano (Anexo I: datos locales cifrados).
# Ver https://github.com/simolus3/sqlite3.dart (hook options).
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

  assets:
    - docs/design/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik.ttf
